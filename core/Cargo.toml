[package]
name = "rsnano_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rsnano_nullable_random = { path = "../nullables/random" }
rsnano_output_tracker = { path = "../nullables/output_tracker" }
rsnano_nullable_clock = { path = "../nullables/clock" }
tools = { package = "rsnano_sha", path = "../tools/sha" }
rand = { version = "0.9.2", default-features = false }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more"] }
anyhow = { version = "1", default-features = false }
# cipher = { version = "0.4", default-features = false }
# ctr = { version = "0", default-features = false }
# ed25519-dalek = { git = "https://github.com/rsnano-node/ed25519-dalek.git", rev = "1f9d706d7033d34bdc1ed7c1789498c82ec0df10", default-features = false, features = ["rand_core"] }
# curve25519-dalek = { git = "https://github.com/rsnano-node/curve25519-dalek.git", rev = "fbc3a9939608b5d455b8a7f7b3499b37834a8bcb", default-features = false }
# blake2 = { version = "0.10", default-features = false }
hex = { version = "0", default-features = false }
num = { version = "0", default-features = false }
num-traits = { version = "0", default-features = false }
num-format = { version = "0", default-features = false }
num-derive = { version = "0", default-features = false }
primitive-types = { version = "0", default-features = false }
# rust-argon2 = { version = "3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
spin = "0.9"
static_assertions = "1"
chrono = { version = "0", default-features = false, features = ["alloc"] }
strum = { version = "0", default-features = false }
strum_macros = { version = "0", default-features = false }
