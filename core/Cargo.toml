[package]
name = "rsnano_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kernel-common = { path = "../common" }
rsnano_nullable_random = { path = "../nullables/random" }
rsnano_output_tracker = { path = "../nullables/output_tracker" }
rsnano_nullable_clock = { path = "../nullables/clock" }
tools = { package = "rsnano_sha", path = "../nullables/sha" }
rand = { version = "0.9.2", default-features = false }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more"] }
anyhow = { version = "1", default-features = false }
# cipher = { version = "0.4", default-features = false }
# ctr = { version = "0", default-features = false }
tracing = { version = "0.1", default-features = false }
hex = { version = "0", default-features = false }
num = { version = "0", default-features = false }
num-traits = { version = "0", default-features = false }
num-format = { version = "0", default-features = false }
num-derive = { version = "0", default-features = false }
primitive-types = { version = "0", default-features = false }
# rust-argon2 = { version = "3", default-features = false }
serde = { version = "=1.0.210", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
spin = "0.9"
static_assertions = "1"
chrono = { version = "0", default-features = false, features = ["alloc"] }
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = { version = "0.26", default-features = false }
