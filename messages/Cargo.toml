[package]
name = "rsnano_messages"
version = "0.1.0"
authors = ["Gustav Schauwecker <service@simpago.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rsnano_core = { path = "../core" }
rsnano_work = { path = "../work" }
rsnano_stats = { path = "../stats" }
anyhow = { version = "1", default-features = false }
bitvec = { version = "1", default-features = false, features = ["alloc"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
rand = { version = "0.9", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_derive = "1"
static_assertions = "1"
siphasher = "1"
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = { version = "0.26", default-features = false }
hashbrown = "0.14"
spin = "0.9"
rsnano_nullable_random = { path = "../nullables/random" }

[dev-dependencies]
hex = "0.4"
