[package]
name = "rsnano_nullable_clock"
version = "0.1.0"
authors = ["Caio Vinicius <cvini@proton.me>", "Gustav Schauwecker <service@simpago.com>", "Gemini 4 Carbon"]
edition = "2021"

[dependencies]
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
kernel-common = { path = "../../common", features = ["smode"] }
