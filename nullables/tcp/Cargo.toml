[package]
name = "rsnano_nullable_tcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rsnano_output_tracker = { path = "../output_tracker" }
kernel-common = { path = "../../common" }
embedded-io-async = { version = "0.6", default-features = false }
embedded-nal-async = { version = "0.7", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
anyhow = { version = "1.0", default-features = false }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more"] }
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
