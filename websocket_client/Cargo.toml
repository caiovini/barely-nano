[package]
name = "rsnano_websocket_client"
version = "0.1.0"
edition = "2024"

[dependencies]
rsnano_core = { path = "../core" }
rsnano_websocket_messages = { path = "../websocket_messages" }
rsnano_nullable_random = { path = "../nullables/random" }
embedded-websocket = { version = "0.9.4", default-features = false }
serde = { version = "=1.0.210", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = { version = "0.26", default-features = false }
anyhow = { version = "1", default-features = false }
hashbrown = { version = "0.14", default-features = false }
rsnano_nullable_tcp = { path = "../nullables/tcp" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
