# =============================================================================
# Bare-Metal RISC-V Nano Node Configuration (config.toml)
# =============================================================================
# Compatible with original Nano / RSNano TOML schema (`[node]`, `[rpc]`, etc.),
# plus `[bare_metal]` for Orange Pi RV2 hardware interface parameters.
# =============================================================================

[bare_metal]
# Nano network variant: "live" (NanoLiveNetwork), "beta" (NanoBetaNetwork), "dev" (NanoDevNetwork), or "test" (NanoTestNetwork)
network = "live"
# UART log verbosity level: "off", "error", "warn", "info", "debug", or "trace"
log_level = "info"
# Set to true to wipe all blocks from persistent NVMe storage and start from zero (Genesis)
wipe_blocks = false
# Ethernet MAC address used by the U-Boot / smoltcp interface
mac_address = "c0:74:2b:f9:15:ec"
# Static IPv4 address and subnet prefix length
ipv4_address = "192.168.1.200"
ipv4_prefix_len = 24
# Default IPv4 gateway
gateway = "192.168.1.1"
# DNS resolver address
dns_server = "192.168.1.1"

[node]
peering_port = 7075
enable_voting = false
# Keep disabled during bootstrap: with ~100k unconfirmed blocks it rolls back (cascading) the
# blocks bootstrap just downloaded on the single ledger-writer hart, starving cementing.
enable_bounded_backlog = false
allow_local_peers = true

# 60,000,000 NANO in raw (60_000_000 * 10^30) = RSNano mainnet default.
# Quorum is 67 percent of max(online weight, this minimum). At 130M the quorum (87.1M) was above
# the whole online weight we can see (~71M), so no election could ever confirm (conf stuck at 1).
online_weight_minimum = "60000000000000000000000000000000000000"
# Minimum vote weight that a representative must have for its vote to be counted (in raw)
representative_vote_weight_minimum = "0"

# Preconfigured peers ("address:port" or hostname)
preconfigured_peers = [
    "peering.nano.org:7075",
    "192.168.1.151:7075",  # local peer for testing
    "37.120.187.138:7075", # live PR peer
    "66.96.83.211:7075",   # live PR peer
    "31.171.245.217:7075", # live PR peer
    "139.59.31.249:7075",  # live PR peer
    "77.72.193.181:7075",  # live PR peer (~5.43M NANO weight, from reference node)
    "95.217.83.244:7075",  # live PR peer (~2.00M NANO weight, from reference node)
    "78.47.124.255:7075",  # live PR peer (~1.95M NANO weight, from reference node)
    "50.21.179.40:7075",  # live PR peer (~1.89M NANO weight, from reference node)
    "18.101.47.105:7075",  # live PR peer (~1.56M NANO weight, from reference node)
    "65.21.104.141:7075",  # live PR peer (~1.24M NANO weight, from reference node)
    "77.33.36.41:7075",  # live PR peer (~1.20M NANO weight, from reference node)
    "93.161.53.161:7075",  # live PR peer (~1.12M NANO weight, from reference node)
    "63.250.52.93:7075",  # live PR peer (~0.73M NANO weight, from reference node)
    "51.81.243.15:7075",  # live PR peer (~0.70M NANO weight, from reference node)
    "46.224.78.48:7075",  # live PR peer (~0.63M NANO weight, from reference node)
    "37.187.73.169:7075",  # live PR peer (~0.60M NANO weight, from reference node)
    "51.15.19.228:7075",  # live PR peer (~0.56M NANO weight, from reference node)
    "65.109.90.95:7075",  # live PR peer (~0.54M NANO weight, from reference node)
    "95.154.217.12:7075",  # live PR peer (~0.50M NANO weight, from reference node)
