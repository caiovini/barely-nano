# =============================================================================
# Bare-Metal RISC-V Nano Node Configuration (config.toml)
# =============================================================================
# Compatible with original Nano / RSNano TOML schema (`[node]`, `[rpc]`, etc.),
# plus `[bare_metal]` for Orange Pi RV2 hardware interface parameters.
# =============================================================================

[bare_metal]
# Nano network variant: "live" (NanoLiveNetwork), "beta" (NanoBetaNetwork), "dev" (NanoDevNetwork), or "test" (NanoTestNetwork)
network = "live"
# UART log verbosity level: "off", "error", "warn", "info", "debug", or "trace"
log_level = "info"
# Set to true to wipe all blocks from persistent NVMe storage and start from zero (Genesis)
wipe_blocks = false
# Ethernet MAC address used by the U-Boot / smoltcp interface
mac_address = "c0:74:2b:f9:15:ec"
# Static IPv4 address and subnet prefix length
ipv4_address = "192.168.1.200"
ipv4_prefix_len = 24
# Default IPv4 gateway
gateway = "192.168.1.1"
# DNS resolver address
dns_server = "192.168.1.1"
# On-board Web Dashboard (Node Metrics, Wallet, and WebAssembly Stress Test)
dashboard_enable = true
dashboard_port = 7080

[node]
peering_port = 7075
enable_voting = false
# Keep disabled during bootstrap: with ~100k unconfirmed blocks it rolls back (cascading) the
# blocks bootstrap just downloaded on the single ledger-writer hart, starving cementing.
enable_bounded_backlog = false
allow_local_peers = true

# 60,000,000 NANO in raw (60_000_000 * 10^30) = RSNano mainnet default.
# Quorum is 67 percent of max(online weight, this minimum). At 130M the quorum (87.1M) was above
# the whole online weight we can see (~71M), so no election could ever confirm (conf stuck at 1).
online_weight_minimum = "60000000000000000000000000000000000000"
# Minimum vote weight that a representative must have for its vote to be counted (in raw; 10 NANO default)
representative_vote_weight_minimum = "10000000000000000000000000000000"

