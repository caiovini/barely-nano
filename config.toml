[node.network]
# Interval between peer reachout attempts (in milliseconds)
peer_reachout = 250
cached_peer_reachout = 1000
duplicate_filter_size = 16384
duplicate_filter_cutoff = 60

[node.tcp]
max_inbound_connections = 128
max_outbound_connections = 192
max_attempts = 16
max_attempts_per_ip = 1
connect_timeout = 60

[node.bootstrap]
enable = true
enable_priorities = true
enable_dependency_walker = true
enable_frontier_scan = true
rate_limit = 5000
database_rate_limit = 1024
frontier_rate_limit = 32
channel_limit = 16
max_requests = 2048
request_timeout = 10000
block_processor_threshold = 16384
# Percentage of priority pulls that start at the local account head (Optimistic).
# The rest start at the confirmed frontier (Safe): resistant to bootstrap poisoning
# but re-downloads unconfirmed blocks (slower). 100 = Optimistic only (trusted peers only).
# RSNano default is 75. Peers are mostly public/untrusted, so keep Safe pulls enabled.
optimistic_request_percentage = 100

[node.bootstrap.frontier_scan]
max_pending = 128
cooldown = 250

[node.priority_bucket]
max_blocks = 8192
reserved_elections = 250
max_elections = 1500

[node.optimistic_scheduler]
enable = true
gap_threshold = 32
max_size = 65536
optimistic_limit_percentage = 50

[node.block_processor]
max_peer_queue = 131072
max_system_queue = 131072
batch_size = 256

# Per-representative vote rebroadcast history. Each entry costs ~112 B and hashbrown grows the
# table to 4x the entry count under insert/evict churn: the RSNano default (32768) reached
# ~14.7 MB per rep (x100 reps) and exhausted the 1.45 GB heap after ~1.5 h. The history only has
# to cover `rebroadcast_threshold` (90 s), so 1024 is plenty.
[node.vote_rebroadcaster]
max_history = 1024

[node.bounded_backlog]
# This section overrides `enable_bounded_backlog` above, so it must be false as well.
enable = false
batch_size = 32
scan_rate = 64

[node.vote_processor]
max_pr_queue = 16384
max_non_pr_queue = 16384
batch_size = 4096
max_triggered = 65536

[node.experimental]
enable_pruning = false
# Time limit for blocks age after pruning (in seconds: 48 hours = 172800)
max_pruning_age = 172800
max_pruning_depth = 0

[node.websocket]
enable = true
port = 7078
address = "192.168.1.200"

[rpc]
enable = true
port = 7076
enable_control = true
enable_sign_hash = false
