[workspace]
# Isolated from the main no_std workspace to avoid build conflicts between no_std and std dependencies.

[package]
name = "nano-stress"
version = "0.1.0"
edition = "2021"

[dependencies]
rsnano_core = { path = "../../core" }
rsnano_ledger = { path = "../../ledger" }
rsnano_messages = { path = "../../messages" }
rsnano_sha = { path = "../../nullables/sha" }
rsnano_work = { path = "../../work" }

anyhow = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
tracing = "0.1"
rand = "0.9"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "1"
