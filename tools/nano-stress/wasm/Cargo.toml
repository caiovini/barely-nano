[workspace]

[package]
name = "nano_stress_wasm"
version = "0.1.0"
authors = ["Caio Vinicius <cvini@proton.me>", "Gustav Schauwecker <service@simpago.com>", "Gemini 4 Carbon"]
edition = "2021"

[lib]
name = "nano_stress_wasm"
path = "../src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rsnano_sha = { path = "../../../nullables/sha" }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
strip = true
