[workspace]
# Standalone host tool for migrating Nano LMDB (data.ldb) directly to Barely-Nano NVMe B-Tree format.

[package]
name = "lmdb-to-nvme"
version = "0.1.0"
authors = ["Caio Vinicius <cvini@proton.me>", "Gustav Schauwecker <service@simpago.com>", "Gemini 4 Carbon"]
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
