[package]
name = "barely-nano"
version = "0.1.0"
authors = ["Caio Vinicius <cvini@proton.me>", "Gustav Schauwecker <service@simpago.com>", "Gemini 4 Carbon"]
edition = "2021"
build = "build.rs"

[[bin]]
name = "barely-nano"
path = "src/bin.rs"

[features]
default = ["smode", "simd", "k1"]
smode = ["kernel-common/smode"] # OpenSBI, SBI ecalls
k1 = ["kernel-common/k1"]       # SpacemiT K1 / Ky X1 (Orange Pi RV2, 8 GB LPDDR4X)
block-test = ["kernel-common/block-test"] # Deterministic bare-metal block generation & pipeline benchmark
spammer = ["block-test"]        # Backwards-compatible alias for block-test
simd = ["rsnano_sha/simd"]

[dependencies]
kernel-common = { path = "../common" }
linked_list_allocator = { version = "0.10", default-features = false, features = [
    "use_spin",
] }
rsnano_node = { path = "../node" }
rsnano_core = { path = "../core" }
rsnano_network = { path = "../network" }
rsnano_ledger = { path = "../ledger" }
rsnano_nullable_random = { path = "../nullables/random" }
rsnano_nullable_clock = { path = "../nullables/clock" }
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "async",
] }
anyhow = { version = "1.0", default-features = false }
spin = { version = "0.9", default-features = false, features = [
    "mutex",
    "spin_mutex",
] }
rsnano_rpc_handler = { path = "../rpc_handler" }
rsnano_rpc_messages = { path = "../rpc_messages" }
rsnano_rpc_server = { path = "../rpc_server", default-features = false }
rsnano_websocket_server = { path = "../websocket_server" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false }
rsnano_sha = { path = "../nullables/sha" }
