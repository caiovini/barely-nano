[package]
name = "kernel-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel_common"
path = "src/lib.rs"

[features]
default = ["smode"]
smode = []   # S-mode via OpenSBI (default for real hardware)
block-test = []

[dependencies]
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
embedded-io-async = { version = "0.6", default-features = false }
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
log = "0.4"
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-tcp", "socket-udp", "socket-dns", "dns-max-result-count-32", "async"] }
rsnano_sha = { path = "../nullables/sha" }
tracing = { version = "0.1", default-features = false }
