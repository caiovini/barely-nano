[package]
name = "rsnano_node"
version = "2.0.0"
authors = ["Gustav Schauwecker \u003cservice@simpago.com\u003e"]
edition = "2024"

[features]
output_tracking = []

[dependencies]
rsnano_core = { path = "../core" }
rsnano_work = { path = "../work" }
rsnano_stats = { path = "../stats" }
rsnano_messages = { path = "../messages" }
rsnano_network = { path = "../network" }
rsnano_network_protocol = { path = "../network_protocol" }
rsnano_output_tracker = { path = "../nullables/output_tracker" }
rsnano_nullable_fs = { path = "../nullables/fs" }
rsnano_nullable_tcp = { path = "../nullables/tcp" }
rsnano_nullable_clock = { path = "../nullables/clock" }
rsnano_nullable_random = { path = "../nullables/random" }
rsnano_nullable_http_client = { path = "../nullables/http_client" }
rsnano_ledger = { path = "../ledger" }
rsnano_websocket_messages = { path = "../websocket_messages" }
anyhow = { version = "1", default-features = false }
primitive-types = { version = "0.12", default-features = false }
bitvec = { version = "1", default-features = false, features = ["alloc"] }
rsnano_sha = { path = "../tools/sha" }
num = { version = "0.4", default-features = false }
num-derive = { version = "0.4", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
once_cell = { version = "1", default-features = false, features = ["alloc"] }
rand = { version = "0.9.2", default-features = false }
serde = { version = "=1.0.210", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
static_assertions = "1"
tracing = { version = "0.1", default-features = false }
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = { version = "0.26", default-features = false }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "alloc"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "rwlock"] }
kernel-common = { path = "../common" }
async-trait = { version = "0.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
libm = "0.2"


